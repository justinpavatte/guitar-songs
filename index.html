<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="apple-touch-icon" sizes="180x180" href="favicon/apple-touch-icon.png?v=20260824-1">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon/favicon-32x32.png?v=20260824-1">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon/favicon-16x16.png?v=20260824-1">
  <link rel="manifest" href="site.webmanifest?v=20260824-2">
  <title>Song Reference</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0d1117">
  <link rel="stylesheet" href="styles.css?v=20260824-4">
</head>
<body>
  <main class="page">
    <header class="page-header">
      <h1>Song Reference</h1>
    </header>

    <div class="search-container">
      <label for="search">Search songs</label>
      <input
        id="search"
        type="search"
        placeholder="Start typing a song name..."
        autocomplete="off"
        disabled
      >
    </div>

    <div id="songs" class="song-list is-loading" aria-busy="true">
      <div class="song-skeleton" aria-hidden="true"></div>
      <div class="song-skeleton" aria-hidden="true"></div>
      <div class="song-skeleton" aria-hidden="true"></div>
      <div class="song-skeleton" aria-hidden="true"></div>
      <div class="song-skeleton" aria-hidden="true"></div>
      <div class="song-skeleton" aria-hidden="true"></div>
    </div>

    <p id="no-results" class="no-results" hidden>
      No matching songs found.
    </p>

    <button id="download-all" class="download-all" type="button" disabled>
      Download All
    </button>

    <button id="delete-all" class="delete-all" type="button">
      Delete All
    </button>

    <div id="download-progress" class="download-progress" hidden>
      <div class="download-progress-text">
        <span id="download-progress-status">Preparing download...</span>
        <span id="download-progress-count">0 / 0</span>
      </div>
      <progress id="download-progress-bar" value="0" max="100"></progress>
    </div>
  </main>

  <script>
    const folder = "songs";
    const songListUrl = "songs.php";
    const listCacheName = "song-reference-list-v1";
    const pdfCacheName = "song-reference-pdfs-v1";
    const songListStorageKey = "song-reference-song-list-v1";

    const songList = document.getElementById("songs");
    const searchInput = document.getElementById("search");
    const noResults = document.getElementById("no-results");
    const downloadAllButton = document.getElementById("download-all");
    const deleteAllButton = document.getElementById("delete-all");

    let songs = [];

    function getPdfUrl(song) {
      const url = new URL(
        `${folder}/${encodeURIComponent(song.fileName)}`,
        document.baseURI
      );

      url.searchParams.set("v", song.version);
      return url.href;
    }

    async function updateDownloadAllButton() {
      if (songs.length === 0) {
        downloadAllButton.disabled = true;
        downloadAllButton.textContent = "Download All";
        return;
      }

      const cache = await caches.open(pdfCacheName);

      for (const song of songs) {
        const cached = await cache.match(getPdfUrl(song));

        if (!cached) {
          downloadAllButton.disabled = false;
          downloadAllButton.textContent = "Download All";
          return;
        }
      }

      downloadAllButton.disabled = true;
      downloadAllButton.textContent = "All Downloaded";
    }

    function cleanName(fileName) {
      return decodeURIComponent(fileName)
        .replace(/\.pdf$/i, "")
        .replace(/[-_]/g, " ")
        .replace(/([A-Z])([A-Z][a-z])/g, "$1 $2")
        .replace(/([a-z0-9])([A-Z])/g, "$1 $2")
        .replace(/([A-Za-z])(\d)/g, "$1 $2")
        .replace(/\s+/g, " ")
        .trim();
    }

    function normalizeSongs(files) {
      if (!Array.isArray(files)) {
        throw new Error("Song list is not an array.");
      }

      return files
        .filter(file => file && file.fileName && file.version != null)
        .map(file => ({
          fileName: String(file.fileName),
          version: String(file.version),
          displayName: cleanName(String(file.fileName))
        }))
        .sort((a, b) => a.displayName.localeCompare(b.displayName));
    }

    function renderSongs(filterText = "") {
      const searchText = filterText.trim().toLowerCase();
      const filteredSongs = songs.filter(song =>
        song.displayName.toLowerCase().includes(searchText)
      );
      const fragment = document.createDocumentFragment();

      filteredSongs.forEach(song => {
        const link = document.createElement("a");
        link.className = "song-link";
        link.href = getPdfUrl(song);
        link.textContent = song.displayName;
        fragment.appendChild(link);
      });

      songList.replaceChildren(fragment);
      songList.classList.remove("is-loading");
      songList.setAttribute("aria-busy", "false");
      noResults.hidden = filteredSongs.length !== 0;

    }

    function useSongFiles(files) {
      songs = normalizeSongs(files);
      renderSongs(searchInput.value);
      searchInput.disabled = songs.length === 0;
      updateDownloadAllButton().catch(console.error);
    }

    function saveSongList(files) {
      try {
        localStorage.setItem(songListStorageKey, JSON.stringify(files));
      } catch (error) {
        console.warn("Could not save song list to local storage:", error);
      }
    }

    function loadSongListFromStorage() {
      try {
        const stored = localStorage.getItem(songListStorageKey);
        return stored ? JSON.parse(stored) : null;
      } catch (error) {
        console.warn("Could not read saved song list:", error);
        return null;
      }
    }

    async function loadSongListFromCache() {
      try {
        const cache = await caches.open(listCacheName);
        const response = await cache.match(songListUrl, { ignoreSearch: true });
        return response ? await response.json() : null;
      } catch (error) {
        console.warn("Could not read cached song list:", error);
        return null;
      }
    }

    function songFilesSignature(files) {
      return JSON.stringify(
        files.map(file => [String(file.fileName), String(file.version)])
      );
    }

    async function refreshSongListInBackground(existingSignature = "") {
      try {
        const refreshUrl = `${songListUrl}?refresh=${Date.now()}`;
        const response = await fetch(refreshUrl, { cache: "no-store" });

        if (!response.ok) {
          throw new Error(`Song list returned ${response.status}`);
        }

        const files = await response.json();
        const normalized = normalizeSongs(files);
        const newSignature = songFilesSignature(normalized);

        saveSongList(files);

        if (newSignature !== existingSignature) {
          songs = normalized;
          renderSongs(searchInput.value);
          searchInput.disabled = songs.length === 0;
          updateDownloadAllButton().catch(console.error);
        }
      } catch (error) {
        // A failed refresh is deliberately silent when offline data is usable.
        console.debug("Background song refresh unavailable:", error);
      }
    }

    async function loadSongs() {
      let loadedFiles = loadSongListFromStorage();

      if (!loadedFiles) {
        loadedFiles = await loadSongListFromCache();
      }

      if (loadedFiles) {
        try {
          useSongFiles(loadedFiles);
          const signature = songFilesSignature(songs);
          refreshSongListInBackground(signature);
          return;
        } catch (error) {
          console.warn("Saved song list was invalid:", error);
        }
      }

      try {
        const response = await fetch(`${songListUrl}?refresh=${Date.now()}`, {
          cache: "no-store"
        });

        if (!response.ok) {
          throw new Error(`Song list returned ${response.status}`);
        }

        const files = await response.json();
        saveSongList(files);
        useSongFiles(files);
      } catch (error) {
        songList.replaceChildren();
        songList.classList.remove("is-loading");
        songList.setAttribute("aria-busy", "false");
        console.error(error);
      }
    }

    searchInput.addEventListener("input", event => {
      renderSongs(event.target.value);
    });

    downloadAllButton.addEventListener("click", async () => {
      downloadAllButton.disabled = true;
      downloadAllButton.textContent = "Downloading...";

      const cache = await caches.open(pdfCacheName);

      for (const song of songs) {
        const url = getPdfUrl(song);

        try {
          const cached = await cache.match(url);

          if (!cached) {
            const response = await fetch(url, { cache: "no-store" });

            if (!response.ok) {
              throw new Error(`PDF returned ${response.status}`);
            }

            await cache.put(url, response.clone());
          }
        } catch (error) {
          console.error(`Could not save ${song.fileName}:`, error);
        }
      }

      await updateDownloadAllButton();
    });

    deleteAllButton.addEventListener("click", async () => {
      deleteAllButton.disabled = true;
      deleteAllButton.textContent = "Deleting...";

      await caches.delete(pdfCacheName);

      deleteAllButton.textContent = "Delete All";
      deleteAllButton.disabled = false;

      await updateDownloadAllButton();
    });

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("service-worker.js?v=20260824-2").catch(error => {
        console.error("Service worker registration failed:", error);
      });
    }

    if (navigator.storage?.persist) {
      navigator.storage.persist().catch(() => {});
    }

    loadSongs();
  </script>
</body>
</html>
