<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- https://favicon.io/favicon-converter/ -->
  <link rel="apple-touch-icon" sizes="180x180" href="favicon/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon/favicon-16x16.png">
  <link rel="manifest" href="site.webmanifest">
  <title>Song Reference</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="styles.css?v=7">
</head>
<body>
  <main class="page">
    <header class="page-header">
      <h1>Song Reference</h1>
      <p id="status">Loading songs...</p>
    </header>

    <div class="search-container">
      <label for="search">Search songs</label>
      <input
        id="search"
        type="search"
        placeholder="Start typing a song name..."
        autocomplete="off"
        disabled
      >
    </div>

    <div id="songs" class="song-list is-loading" aria-busy="true">
      <div class="song-skeleton" aria-hidden="true"></div>
      <div class="song-skeleton" aria-hidden="true"></div>
      <div class="song-skeleton" aria-hidden="true"></div>
      <div class="song-skeleton" aria-hidden="true"></div>
      <div class="song-skeleton" aria-hidden="true"></div>
      <div class="song-skeleton" aria-hidden="true"></div>
    </div>

    <p id="no-results" class="no-results" hidden>
      No matching songs found.
    </p>

    <button id="download-all" class="download-all" type="button" disabled>
      Download All
    </button>

    <button id="delete-all" class="delete-all" type="button">
      Delete All
    </button>

    <div id="download-progress" class="download-progress" hidden>
      <div class="download-progress-text">
        <span id="download-progress-status">Preparing download...</span>
        <span id="download-progress-count">0 / 0</span>
      </div>
      <progress id="download-progress-bar" value="0" max="100"></progress>
    </div>
  </main>

  <script>
    const owner = "justinpavatte";
    const repo = "guitar-songs";
    const folder = "songs";

    const status = document.getElementById("status");
    const songList = document.getElementById("songs");
    const searchInput = document.getElementById("search");
    const noResults = document.getElementById("no-results");
    const downloadAllButton = document.getElementById("download-all");
    const deleteAllButton = document.getElementById("delete-all");

    let songs = [];


    function getPdfUrl(song) {
      return new URL(
        `${folder}/${encodeURIComponent(song.fileName)}`,
        document.baseURI
      ).href;
    }

    async function updateDownloadAllButton() {
      if (songs.length === 0) {
        downloadAllButton.disabled = true;
        downloadAllButton.textContent = "Download All PDFs";
        return;
      }

      const cache = await caches.open("song-reference-pdfs-v1");

      for (const song of songs) {
        const url = getPdfUrl(song);
        const cached = await cache.match(url);

        if (!cached) {
          downloadAllButton.disabled = false;
          downloadAllButton.textContent = "Download All PDFs";
          return;
        }
      }

      downloadAllButton.disabled = true;
      downloadAllButton.textContent = "All PDFs Downloaded";
    }

    function cleanName(fileName) {
      return decodeURIComponent(fileName)
        .replace(/\.pdf$/i, "")
        .replace(/[-_]/g, " ")
        .replace(/([A-Z])([A-Z][a-z])/g, "$1 $2")
        .replace(/([a-z0-9])([A-Z])/g, "$1 $2")
        .replace(/\s+/g, " ")
        .trim();
    }

    function renderSongs(filterText = "") {
      const searchText = filterText.trim().toLowerCase();

      const filteredSongs = songs.filter(song =>
        song.displayName.toLowerCase().includes(searchText)
      );

      const fragment = document.createDocumentFragment();

      filteredSongs.forEach(song => {
        const link = document.createElement("a");
        link.className = "song-link";
        link.href = `${folder}/${encodeURIComponent(song.fileName)}`;
        link.textContent = song.displayName;
        link.addEventListener("click", async event => {
          event.preventDefault();

          try {
            const cache = await caches.open("song-reference-pdfs-v1");
            const cached = await cache.match(link.href);

            if (!cached) {
              const response = await fetch(link.href, { cache: "no-store" });

              if (!response.ok) {
                throw new Error(`PDF returned ${response.status}`);
              }

              await cache.put(link.href, response.clone());
            }
          } catch (error) {
            console.error("Could not pre-cache PDF:", error);
          }

          window.location.href = link.href;
        });

        fragment.appendChild(link);
      });

      songList.replaceChildren(fragment);
      songList.classList.remove("is-loading");
      songList.setAttribute("aria-busy", "false");

      noResults.hidden = filteredSongs.length !== 0;

      if (searchText === "") {
        status.textContent =
          `${songs.length} song${songs.length === 1 ? "" : "s"}`;
      } else {
        status.textContent =
          `${filteredSongs.length} of ${songs.length} songs`;
      }
    }

    async function loadSongs() {
      const apiUrl =
        `https://api.github.com/repos/${owner}/${repo}/contents/${folder}`;
      const apiCache = await caches.open("song-reference-api-v1");

      try {
        let response;

        try {
          response = await fetch(apiUrl, { cache: "no-store" });

          if (!response.ok) {
            throw new Error(`GitHub API returned ${response.status}`);
          }

          await apiCache.put(apiUrl, response.clone());
        } catch (networkError) {
          response = await apiCache.match(apiUrl);

          if (!response) {
            throw networkError;
          }
        }

        const files = await response.json();

        songs = files
          .filter(file =>
            file.type === "file" &&
            file.name.toLowerCase().endsWith(".pdf")
          )
          .map(file => ({
            fileName: file.name,
            displayName: cleanName(file.name)
          }))
          .sort((a, b) =>
            a.displayName.localeCompare(b.displayName)
          );

        if (songs.length === 0) {
          status.textContent = "No PDF songs found.";
          return;
        }

        renderSongs();
        searchInput.disabled = false;
        await updateDownloadAllButton();
      } catch (error) {
        songList.replaceChildren();
        songList.classList.remove("is-loading");
        songList.setAttribute("aria-busy", "false");
        status.textContent = "Could not load song list.";
        console.error(error);
      }
    }

    searchInput.addEventListener("input", event => {
      renderSongs(event.target.value);
    });

    downloadAllButton.addEventListener("click", async () => {
      downloadAllButton.disabled = true;
      downloadAllButton.textContent = "Downloading...";

      const cache = await caches.open("song-reference-pdfs-v1");

      for (const song of songs) {
        const url = getPdfUrl(song);

        try {
          const cached = await cache.match(url);

          if (!cached) {
            const response = await fetch(url, { cache: "no-store" });

            if (!response.ok) {
              throw new Error(`PDF returned ${response.status}`);
            }

            await cache.put(url, response.clone());
          }
        } catch (error) {
          console.error(`Could not save ${song.fileName}:`, error);
        }
      }

      await updateDownloadAllButton();
    });

    deleteAllButton.addEventListener("click", async () => {
      deleteAllButton.disabled = true;
      deleteAllButton.textContent = "Deleting...";

      await caches.delete("song-reference-pdfs-v1");

      deleteAllButton.textContent = "Delete All Local PDFs";
      deleteAllButton.disabled = false;

      await updateDownloadAllButton();
    });

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("service-worker.js").catch(error => {
        console.error("Service worker registration failed:", error);
      });
    }

    if (navigator.storage?.persist) {
      navigator.storage.persist().catch(() => {});
    }

    loadSongs();
  </script>
</body>
</html>
